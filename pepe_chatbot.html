<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoBot · PEPE · SGA Ucundinamarca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #e8f5e9;
  --card: #ffffff;
  --accent: #2e7d32;
  --accent-2: #4caf50;
  --accent-light: #a5d6a7;
  --muted: #6b7a6e;
  --chat-bg: #f1f8f2;
  --bot-bubble: #d9fdd3;
  --user-bubble: #e3f2fd;
  --shadow: 0 8px 24px rgba(46,125,50,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(76,175,80,0.10) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(46,125,50,0.08) 0%, transparent 40%);
  color: #1b2e1d;
}

.app {
  display: flex;
  gap: 20px;
  max-width: 1080px;
  margin: 28px auto;
  padding: 0 16px;
  height: calc(100vh - 56px);
}

/* ---- SIDEBAR ---- */
.sidebar {
  width: 250px;
  flex-shrink: 0;
  background: var(--card);
  border-radius: 20px;
  padding: 20px 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 16px;
  border: 1px solid rgba(165,214,167,0.4);
}

.bot-avatar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px 0 4px;
}

.avatar-circle {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--accent-2);
  box-shadow: 0 4px 16px rgba(46,125,50,0.20);
  background: #f0faf1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar-circle img {
  width: 120%;
  height: 120%;
  object-fit: cover;
  object-position: center 10%;
  margin-top: -8px;
}

.bot-avatar h3 {
  font-family: 'Poppins', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  text-align: center;
}

.bot-avatar p {
  font-size: .82rem;
  color: var(--muted);
  text-align: center;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #e8f5e9;
  border: 1px solid var(--accent-light);
  color: var(--accent);
  font-size: .75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
}

.status-dot {
  width: 7px; height: 7px;
  background: var(--accent-2);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .6; transform: scale(1.3); }
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
}

.hint {
  font-size: .83rem;
  color: var(--muted);
  background: #f6fbf6;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid rgba(165,214,167,0.3);
}

.hint strong { color: var(--accent); display: block; margin-bottom: 6px; }
.hint ul { padding-left: 16px; }
.hint li { margin-bottom: 4px; line-height: 1.5; }
.hint code {
  background: var(--accent-light);
  color: var(--accent);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: .8rem;
}

/* ---- CHAT PANEL ---- */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.chat-header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  padding: 14px 20px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 12px rgba(46,125,50,0.25);
  flex-shrink: 0;
}

.header-icon {
  font-size: 1.8rem;
  line-height: 1;
}

.chat-header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 2px;
}

.chat-header small {
  color: rgba(255,255,255,0.88);
  font-size: .78rem;
}

/* Messages area */
.chat-box {
  background: var(--chat-bg);
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  border-radius: 16px;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  scroll-behavior: smooth;
  border: 1px solid rgba(165,214,167,0.3);
}

.chat-box::-webkit-scrollbar { width: 5px; }
.chat-box::-webkit-scrollbar-track { background: transparent; }
.chat-box::-webkit-scrollbar-thumb { background: var(--accent-light); border-radius: 10px; }

.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 16px;
  line-height: 1.55;
  font-size: .93rem;
  animation: fadeUp .25s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bot-message {
  background: var(--bot-bubble);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.user-message {
  background: var(--user-bubble);
  align-self: flex-end;
  text-align: right;
  border-bottom-right-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

/* Options */
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
  animation: fadeUp .3s ease;
}

.option-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 7px 13px;
  border-radius: 20px;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  transition: transform .15s, filter .15s;
  box-shadow: 0 2px 6px rgba(46,125,50,0.2);
}

.option-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.option-btn:active {
  transform: translateY(0);
}

/* Input area */
.input-area {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  margin-top: 10px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
  border: 1px solid rgba(165,214,167,0.4);
  flex-shrink: 0;
}

.input-area input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #c8e6c9;
  font-size: .95rem;
  font-family: 'Nunito', sans-serif;
  outline: none;
  transition: border-color .2s;
  background: #fafffe;
}

.input-area input:focus { border-color: var(--accent-2); }

.input-area button {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: .9rem;
  cursor: pointer;
  transition: transform .15s, filter .15s;
  box-shadow: 0 2px 8px rgba(46,125,50,0.25);
}

.input-area button:hover { filter: brightness(1.08); transform: translateY(-1px); }

/* Responsive */
@media (max-width: 860px) {
  .app { flex-direction: column; height: auto; padding: 8px; margin: 8px; gap: 12px; }
  .sidebar { width: 100%; flex-direction: row; align-items: center; gap: 16px; padding: 14px; }
  .bot-avatar { flex-direction: row; }
  .avatar-circle { width: 64px; height: 64px; }
  .chat-panel { min-height: 500px; }
  .hint { display: none; }
}
  </style>
